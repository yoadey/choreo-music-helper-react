name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  e2e:
    runs-on: ubuntu-latest
    env:
      # Same layout as the GitHub Pages project site
      EXPO_BASE_URL: /choreo-music-helper-react
      BASE_PATH: /choreo-music-helper-react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # Static files for an own web server, served from the root of the domain (EXPO_BASE_URL empty).
  # Relative paths are not possible: Expo references the scripts absolutely and the router needs the base path
  # to match routes. Unzip the artifact into the web root of the server.
  # Builds of main are also published as release web-latest (web.zip), which scripts/deploy.sh installs: unlike
  # artifacts, release files can be downloaded without a token.
  web-artifact:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: web-${{ github.sha }}
          path: dist
      - name: Publish as release web-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr ../web.zip .)
          git tag -f web-latest
          git push -f origin refs/tags/web-latest
          gh release view web-latest > /dev/null 2>&1 ||
            gh release create web-latest --prerelease --title "Latest build of main" --notes "Built from main"
          gh release upload web-latest web.zip --clobber
          gh release edit web-latest --notes "Built from main, commit $GITHUB_SHA. Install it with scripts/deploy.sh."
