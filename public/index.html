<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#252525" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Choreo Music" />
    <meta name="description" content="Rehearse choreographies: split songs into clips, loop and slow them down. Works offline, all data stays on your device." />
    <title>%WEB_TITLE%</title>
    <!-- Relative links, so the app also works in a sub directory (e.g. GitHub Pages project sites). The build
         makes them absolute with the base path, see scripts/postbuild-web.mjs -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #1c1c1e;
        /* App-like behavior: long press opens the clip menu instead of the text selection / link preview */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const hadController = !!navigator.serviceWorker.controller
          let updateRequested = false
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            // Only the tab that activated the new version while starting reloads, other open tabs
            // (e.g. one that is playing) keep running and use the new version on their next start
            if (updateRequested) window.location.reload()
          })
          navigator.serviceWorker
            .register('sw.js', { scope: './' })
            .then((registration) => {
              // Updates are only activated while starting the app, never during playback
              if (registration.waiting && hadController) {
                updateRequested = true
                registration.waiting.postMessage('SKIP_WAITING')
              }
            })
            .catch((error) => console.error('Service worker registration failed:', error))
        })
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
