<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1" />
    <meta name="theme-color" content="#252525" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Choreo Music" />
    <meta name="description" content="Rehearse choreographies: split songs into clips, loop and slow them down. Works offline, all data stays on your device." />
    <title>%WEB_TITLE%</title>
    <!-- The build makes these links absolute with the base path (EXPO_BASE_URL, which a sub directory like
         a GitHub Pages project site needs anyway), so they also work in 404.html for deep links of any depth.
         See scripts/postbuild-web.mjs -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        background-color: #1c1c1e;
        /* App-like behavior: long press opens the clip menu instead of the text selection / link preview */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // The install prompt (Chrome, Edge, Android) can be fired before the app is loaded, it is kept for the
      // install button in the settings. See src/helpers/pwa.ts
      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault()
        window.deferredInstallPrompt = event
        window.dispatchEvent(new Event('installpromptchange'))
      })
      window.addEventListener('appinstalled', () => {
        window.deferredInstallPrompt = undefined
        window.appInstalled = true
        window.dispatchEvent(new Event('installpromptchange'))
      })
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const hadController = !!navigator.serviceWorker.controller
          let updateRequested = false
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            // Only the tab that activated the new version while starting reloads, other open tabs
            // (e.g. one that is playing) keep running and use the new version on their next start
            if (updateRequested) window.location.reload()
          })
          navigator.serviceWorker
            .register('sw.js', { scope: './' })
            .then((registration) => {
              // Updates are only activated while starting the app, never during playback
              if (registration.waiting && hadController) {
                updateRequested = true
                registration.waiting.postMessage('SKIP_WAITING')
              }
              // Lets the end-to-end tests wait until the start of the app is done
              document.documentElement.dataset.serviceWorkerStarted = 'true'
            })
            .catch((error) => console.error('Service worker registration failed:', error))
        })
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
